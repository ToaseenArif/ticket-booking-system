<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Tickets — Wayfare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<header class="navbar">
  <a href="index.html" class="logo"><span class="logo-box"></span>Wayfare</a>
  <div class="nav-buttons">
    <a class="link-btn" href="index.html">Back to home</a>
  </div>
</header>
 
<section class="section">
  <a href="index.html" class="back-link">← New search</a>
  <div class="section-head">
    <p class="eyebrow">Bus tickets</p>
    <h2>Available buses</h2>
    <p class="results-summary" id="results-summary"></p>
  </div>
 
  <div class="grid-3">
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Bus</span><strong>Rs 1,800</strong></div>
      <div class="route-path">Daewoo Express</div>
      <div class="route-meta">5h 10m · Departs 7:00 AM</div>
    </div>
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Bus</span><strong>Rs 1,650</strong></div>
      <div class="route-path">Faisal Movers</div>
      <div class="route-meta">5h 40m · Departs 9:30 AM</div>
    </div>
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Bus</span><strong>Rs 2,100</strong></div>
      <div class="route-path">Skyways (Business class)</div>
      <div class="route-meta">4h 55m · Departs 11:00 AM</div>
    </div>
  </div>
</section>
 
<footer>
  <div class="footer-bottom">© 2026 Wayfare Tickets. All rights reserved.</div>
</footer>
 
<script src="results.js"></script>
</body>
</html>
