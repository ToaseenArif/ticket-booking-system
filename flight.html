<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Tickets — Wayfare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<header class="navbar">
  <a href="index.html" class="logo"><span class="logo-box"></span>Wayfare</a>
  <div class="nav-buttons">
    <a class="link-btn" href="index.html">Back to home</a>
  </div>
</header>
 
<section class="section">
  <a href="index.html" class="back-link">← New search</a>
  <div class="section-head">
    <p class="eyebrow">Flight tickets</p>
    <h2>Available flights</h2>
    <p class="results-summary" id="results-summary"></p>
  </div>
 
  <div class="grid-3">
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Flight</span><strong>Rs 12,300</strong></div>
      <div class="route-path">PIA · Economy</div>
      <div class="route-meta">2h 05m · Departs 7:45 AM</div>
    </div>
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Flight</span><strong>Rs 14,900</strong></div>
      <div class="route-path">AirBlue · Economy</div>
      <div class="route-meta">1h 55m · Departs 1:30 PM</div>
    </div>
    <div class="card route-card">
      <div class="route-top"><span class="route-tag">Flight</span><strong>Rs 24,500</strong></div>
      <div class="route-path">Serene Air · Business</div>
      <div class="route-meta">1h 50m · Departs 6:10 PM</div>
    </div>
  </div>
</section>
 
<footer>
  <div class="footer-bottom">© 2026 Wayfare Tickets. All rights reserved.</div>
</footer>
 
<script src="results.js"></script>
</body>
</html>
